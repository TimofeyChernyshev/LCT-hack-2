openapi: 3.1.0
info: { title: FSP Platform — Testing Service, version: 1.0.0 }
servers: [{ url: http://localhost:8085 }]
security: [{ bearerAuth: [] }]

paths:
  /healthz:
    get: { security: [], operationId: healthz, responses: { "200": { description: OK } } }

  /me/sessions:
    post:
      summary: Старт тест-сессии на выбранную категорию
      operationId: startSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartSessionRequest" }
      responses:
        "201":
          description: Сессия создана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
    get:
      operationId: listMySessions
      responses:
        "200":
          description: Сессии
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }

  /me/sessions/{id}:
    get:
      operationId: getSession
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Сессия с заданиями (без решений)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithItems" }

  /me/sessions/{id}/answers:
    post:
      operationId: answerItem
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerInput" }
      responses:
        "200":
          description: Ответ принят
        "409":
          description: Задание уже отвечено или сессия закрыта

  /me/sessions/{id}/submit:
    post:
      operationId: submitSession
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Результат и итоговая категория
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResult" }

  /me/category-changes:
    get:
      summary: История смены грейда и остаток кулдауна
      operationId: listGradeChanges
      responses:
        "200":
          description: Список
          content:
            application/json:
              schema:
                type: object
                properties:
                  canChangeAt: { type: [string, "null"], format: date-time }
                  changes:
                    type: array
                    items: { $ref: "#/components/schemas/GradeChange" }

  /me/questionnaire:
    post:
      summary: Опросник на входе — определение специализации и заявленного грейда
      operationId: submitQuestionnaire
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionnaireInput" }
      responses:
        "200":
          description: Рекомендованная категория и статус кулдауна
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionnaireResult" }
    get:
      summary: Получение текущего статуса опросника и кулдауна
      operationId: getQuestionnaireState
      responses:
        "200":
          description: Статус опросника и готовности к тесту
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionnaireState" }

  /me/periodic-tasks:
    get:
      operationId: listPeriodicTasks
      responses:
        "200":
          description: Регулярные задачи для кандидата
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PeriodicTask" }

  /me/periodic-tasks/{id}/submit:
    post:
      operationId: submitPeriodicTask
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { answer: { type: string } }
              required: [answer]
      responses:
        "200": { description: Принято }

  # админ/работодательское
  /periodic-tasks:
    post:
      operationId: createPeriodicTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PeriodicTaskInput" }
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeriodicTask" }

  /internal/users/{userId}/category:
    get:
      summary: Внутренний эндпоинт — текущая категория кандидата
      operationId: internalGetCategory
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Категория
          content:
            application/json:
              schema:
                type: object
                properties:
                  categoryId: { type: string, format: uuid }
                  gradeId: { type: string, format: uuid }
                  testScore: { type: number }

  /me/fsp:
    get:
      summary: Получение профиля и достижений ФСП кандидата (с поддержкой No-FSP)
      operationId: getMyFSP
      responses:
        "200":
          description: Данные профиля ФСП (обогащенные или нейтральные)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateFSPProfile" }
    put:
      summary: Привязка аккаунта кандидата к FSP ID
      operationId: linkFSP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkFSPRequest" }
      responses:
        "200":
          description: Профиль успешно обогащен данными ФСП
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateFSPProfile" }
        "404":
          description: Участник не найден в реестре ФСП
    delete:
      summary: Отвязка FSP ID и возврат профиля в нейтральное состояние
      operationId: unlinkFSP
      responses:
        "200":
          description: FSP отвязан, профиль возвращен в базовое состояние
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateFSPProfile" }

  /me/fsp/sync-keycloak:
    post:
      summary: Автоматическая синхронизация FSP ID из клеймов Keycloak токена
      operationId: syncKeycloakFSP
      responses:
        "200":
          description: Результат синхронизации
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateFSPProfile" }

  /internal/candidates/{userId}/fsp:
    get:
      summary: Внутренний эндпоинт данных ФСП для поисковой выдачи и ранжирования
      operationId: internalGetCandidateFSP
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Данные ФСП кандидата
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateFSPProfile" }

  /fsp/registry/members:
    get:
      security: []
      summary: Поиск участников в реестре Федерации спортивного программирования
      operationId: searchFSPRegistryMembers
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: rank, schema: { type: string } }
        - { in: query, name: region, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Список участников
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/FSPRegistryMember" }

  /fsp/registry/members/{fspId}:
    get:
      security: []
      summary: Получение карточки участника из реестра ФСП
      operationId: getFSPRegistryMember
      parameters:
        - { in: path, name: fspId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Участник найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FSPRegistryMember" }
        "404":
          description: Участник не найден

  /fsp/registry/verify:
    post:
      security: []
      summary: Верификация участника в реестре ФСП
      operationId: verifyFSPMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FSPVerificationRequest" }
      responses:
        "200":
          description: Результат верификации
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FSPVerificationResult" }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    StartSessionRequest:
      type: object
      properties:
        targetCategoryId: { type: string, format: uuid }
      required: [targetCategoryId]
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        targetCategoryId: { type: string, format: uuid }
        status: { type: string, enum: [in_progress, submitted, evaluated, expired, cancelled] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
      required: [id, targetCategoryId, status, startedAt]
    SessionWithItems:
      allOf:
        - $ref: "#/components/schemas/Session"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/SessionItem" }
    SessionItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        position: { type: integer }
        type: { type: string, enum: [single_choice, multi_choice, code, text, sql, regex] }
        topic: { type: string }
        body: { type: string }
        status: { type: string, enum: [pending, answered, skipped] }
      required: [id, position, type, topic, body, status]
    AnswerInput:
      type: object
      properties:
        itemId: { type: string, format: uuid }
        answer: { description: Произвольный JSON-ответ }
        skipped: { type: boolean, default: false }
      required: [itemId]
    SessionResult:
      type: object
      properties:
        sessionId: { type: string, format: uuid }
        score: { type: number }
        abilityEstimate: { type: number }
        resultingGradeId: { type: string, format: uuid }
        resultingCategoryId: { type: string, format: uuid }
        decision: { type: string, enum: [confirmed, downgrade_offered, upgrade_offered] }
        explanation: { type: string }
      required: [sessionId, score, resultingGradeId, resultingCategoryId, decision]
    QuestionnaireInput:
      type: object
      properties:
        specializationId: { type: string, format: uuid }
        claimedGradeId: { type: string, format: uuid }
        yearsExperience: { type: number }
        technologies:
          type: array
          items: { type: string }
      required: [specializationId, claimedGradeId]
    QuestionnaireResult:
      type: object
      properties:
        targetCategoryId: { type: string, format: uuid }
        recommendedGradeId: { type: string, format: uuid }
        canStartTest: { type: boolean }
        cooldownRemainingDays: { type: integer }
        canChangeAt: { type: [string, "null"], format: date-time }
        message: { type: string }
      required: [targetCategoryId, canStartTest, message]
    QuestionnaireState:
      type: object
      properties:
        state: { type: object }
        canChangeAt: { type: [string, "null"], format: date-time }
        canStartTest: { type: boolean }
      required: [canStartTest]
    GradeChange:
      type: object
      properties:
        fromGradeId: { type: [string, "null"], format: uuid }
        toGradeId: { type: string, format: uuid }
        reason: { type: string }
        changedAt: { type: string, format: date-time }
    PeriodicTaskInput:
      type: object
      properties:
        categoryId: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
      required: [categoryId, title, body]
    PeriodicTask:
      allOf:
        - $ref: "#/components/schemas/PeriodicTaskInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }

    CandidateFSPProfile:
      type: object
      properties:
        userId: { type: string, format: uuid }
        hasFsp: { type: boolean }
        fspMemberId: { type: [string, "null"] }
        fullName: { type: [string, "null"] }
        sportsRank: { type: [string, "null"] }
        fspRating: { type: integer }
        region: { type: [string, "null"] }
        discipline: { type: [string, "null"] }
        fspScore: { type: number }
        fspWeightSum: { type: integer }
        achievementsCount: { type: integer }
        bestPlace: { type: [integer, "null"] }
        verificationSource: { type: string }
        linkedAt: { type: [string, "null"], format: date-time }
        explanation: { type: string }
        achievements:
          type: array
          items: { $ref: "#/components/schemas/FSPAchievement" }
      required: [userId, hasFsp, fspRating, fspScore, fspWeightSum, achievementsCount, verificationSource, explanation, achievements]

    LinkFSPRequest:
      type: object
      properties:
        fspMemberId: { type: string }
      required: [fspMemberId]

    FSPAchievement:
      type: object
      properties:
        id: { type: string }
        externalId: { type: [string, "null"] }
        eventName: { type: string }
        eventDate: { type: [string, "null"] }
        place: { type: [integer, "null"] }
        category: { type: string }
        score: { type: [number, "null"] }
        weight: { type: integer }
        badge: { type: [string, "null"] }
        description: { type: [string, "null"] }
      required: [eventName, category, weight]

    FSPRegistryMember:
      type: object
      properties:
        fspId: { type: string }
        fullName: { type: string }
        sportsRank: { type: string }
        rating: { type: integer }
        region: { type: string }
        discipline: { type: string }
        status: { type: string }
        verified: { type: boolean }
        achievements:
          type: array
          items: { $ref: "#/components/schemas/FSPAchievement" }
      required: [fspId, fullName, sportsRank, rating, region, verified]

    FSPVerificationRequest:
      type: object
      properties:
        fspId: { type: string }
        fullName: { type: string }
        certificate: { type: string }
      required: [fspId]

    FSPVerificationResult:
      type: object
      properties:
        isValid: { type: boolean }
        message: { type: string }
        verifiedAt: { type: string, format: date-time }
        member: { $ref: "#/components/schemas/FSPRegistryMember" }
      required: [isValid, message, verifiedAt]