openapi: 3.1.0
info: { title: FSP Platform — Testing Service, version: 1.0.0 }
servers: [{ url: http://localhost:8085 }]
security: [{ bearerAuth: [] }]

paths:
  /healthz:
    get: { summary: Проверка живости сервиса, security: [], operationId: healthz, responses: { "200": { description: OK } } }

  /me/sessions:
    post:
      summary: Старт тест-сессии на выбранную категорию
      operationId: startSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartSessionRequest" }
      responses:
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "201":
          description: Сессия создана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
    get:
      summary: Мои тест-сессии
      operationId: listMySessions
      responses:
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "200":
          description: Сессии
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }

  /me/sessions/{id}:
    get:
      summary: Сессия с заданиями без правильных ответов
      operationId: getSession
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "200":
          description: Сессия с заданиями (без решений)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithItems" }

  /me/sessions/{id}/answers:
    post:
      summary: Ответ на задание
      operationId: answerItem
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerInput" }
      responses:
        "200":
          description: Ответ принят
        "409":
          description: Задание уже отвечено или сессия закрыта

  /me/sessions/{id}/submit:
    post:
      summary: Завершить тест и получить результат
      operationId: submitSession
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "200":
          description: Результат и итоговая категория
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResult" }

  /me/category-changes:
    get:
      summary: История смены грейда и остаток кулдауна
      operationId: listGradeChanges
      responses:
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "200":
          description: Список
          content:
            application/json:
              schema:
                type: object
                properties:
                  canChangeAt: { type: [string, "null"], format: date-time }
                  changes:
                    type: array
                    items: { $ref: "#/components/schemas/GradeChange" }

  /me/periodic-tasks:
    get:
      summary: Регулярные задания кандидата
      operationId: listPeriodicTasks
      responses:
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "200":
          description: Регулярные задачи для кандидата
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PeriodicTask" }

  /me/periodic-tasks/{id}/submit:
    post:
      summary: Ответ на регулярное задание
      operationId: submitPeriodicTask
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { answer: { type: string } }
              required: [answer]
      responses:
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "200": { description: Принято }

  # админ/работодательское
  /periodic-tasks:
    post:
      summary: Создать регулярное задание
      operationId: createPeriodicTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PeriodicTaskInput" }
      responses:
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeriodicTask" }

  /internal/users/{userId}/category:
    get:
      summary: Внутренний эндпоинт — текущая категория кандидата
      operationId: internalGetCategory
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string, format: uuid } }
      responses:
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "200":
          description: Категория
          content:
            application/json:
              schema:
                type: object
                properties:
                  categoryId: { type: string, format: uuid }
                  gradeId: { type: string, format: uuid }
                  testScore: { type: number }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    BadRequest:
      description: Неверный запрос
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Доступ запрещён
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Конфликт состояния
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        code: { type: string, example: BAD_REQUEST }
        message: { type: string }
      required: [code, message]
    StartSessionRequest:
      type: object
      properties:
        targetCategoryId: { type: string, format: uuid }
      required: [targetCategoryId]
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        targetCategoryId: { type: string, format: uuid }
        status: { type: string, enum: [in_progress, submitted, evaluated, expired, cancelled] }
        startedAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time, description: Момент, когда сессия закрывается по таймеру }
        finishedAt: { type: [string, "null"], format: date-time }
      required: [id, targetCategoryId, status, startedAt]
    SessionWithItems:
      allOf:
        - $ref: "#/components/schemas/Session"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/SessionItem" }
    SessionItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        position: { type: integer }
        type: { type: string, enum: [single_choice, multi_choice, code, text, sql, regex] }
        topic: { type: string }
        body: { type: string }
        options:
          type: array
          description: Варианты для single_choice и multi_choice. Для открытых заданий пустой список.
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
            required: [id, label]
        status: { type: string, enum: [pending, answered, skipped] }
      required: [id, position, type, topic, body, status]
    AnswerInput:
      type: object
      properties:
        itemId: { type: string, format: uuid }
        answer:
          description: Строка, список id вариантов или объект
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
            - { type: object, additionalProperties: true }
        skipped: { type: boolean, default: false }
      required: [itemId]
    SessionResult:
      type: object
      properties:
        sessionId: { type: string, format: uuid }
        score: { type: number }
        abilityEstimate: { type: number }
        resultingGradeId: { type: string, format: uuid }
        resultingCategoryId: { type: string, format: uuid }
        decision: { type: string, enum: [confirmed, downgrade_offered, upgrade_offered] }
      required: [sessionId, score, resultingGradeId, resultingCategoryId, decision]
    GradeChange:
      type: object
      properties:
        fromGradeId: { type: [string, "null"], format: uuid }
        toGradeId: { type: string, format: uuid }
        reason: { type: string }
        changedAt: { type: string, format: date-time }
    PeriodicTaskInput:
      type: object
      properties:
        categoryId: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
      required: [categoryId, title, body]
    PeriodicTask:
      allOf:
        - $ref: "#/components/schemas/PeriodicTaskInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
