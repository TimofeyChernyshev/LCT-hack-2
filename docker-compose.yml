name: fsp-platform

x-go-common-env: &go-common-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-32-chars-min}
  JWT_ISSUER: ${JWT_ISSUER:-fsp-platform}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
  EMAIL_VERIFICATION_TTL: ${EMAIL_VERIFICATION_TTL:-24h}
  PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-1h}
  SMTP_HOST: ${SMTP_HOST:-mailhog}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-noreply@fsp.local}
  SMTP_TLS: ${SMTP_TLS:-false}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
  GRADE_CHANGE_COOLDOWN_DAYS: ${GRADE_CHANGE_COOLDOWN_DAYS:-90}
  REVEAL_CONTACTS_ON_APPLICATION: ${REVEAL_CONTACTS_ON_APPLICATION:-true}
  AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth:8080}
  DICT_SERVICE_URL: ${DICT_SERVICE_URL:-http://dict:8080}
  CANDIDATE_SERVICE_URL: ${CANDIDATE_SERVICE_URL:-http://candidate:8080}
  EMPLOYER_SERVICE_URL: ${EMPLOYER_SERVICE_URL:-http://employer:8080}
  TESTING_SERVICE_URL: ${TESTING_SERVICE_URL:-http://testing:8080}
  INTERACTION_SERVICE_URL: ${INTERACTION_SERVICE_URL:-http://interaction:8080}
  SEARCH_SERVICE_URL: ${SEARCH_SERVICE_URL:-http://search:8080}

services:

  # Postgres
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fsp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsp}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-auth_db,dict_db,candidate_db,employer_db,testing_db,interaction_db,search_db}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/00-init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fsp} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [fsp]

  # MailHog
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "${MAILHOG_UI_PORT:-8025}:8025"
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
    networks: [fsp]

  # Auth
  auth:
    build:
      context: .
      dockerfile: Dockerfile.auth
    restart: unless-stopped
    environment:
      <<: *go-common-env
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-fsp}:${POSTGRES_PASSWORD:-fsp}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${AUTH_DB:-auth_db}?sslmode=disable
    ports:
      - "${AUTH_HOST_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [fsp]

  # Dict
  dict:
    build:
      context: .
      dockerfile: Dockerfile.dict
    restart: unless-stopped
    environment:
      <<: *go-common-env
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-fsp}:${POSTGRES_PASSWORD:-fsp}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${DICT_DB:-dict_db}?sslmode=disable
    ports:
      - "${DICT_HOST_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [fsp]

  # Candidate
  candidate:
    build:
      context: .
      dockerfile: Dockerfile.candidate
    restart: unless-stopped
    environment:
      <<: *go-common-env
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-fsp}:${POSTGRES_PASSWORD:-fsp}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${CANDIDATE_DB:-candidate_db}?sslmode=disable
    ports:
      - "${CANDIDATE_HOST_PORT:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      dict:
        condition: service_started
    networks: [fsp]

  # Employer
  employer:
    build:
      context: .
      dockerfile: Dockerfile.employer
    restart: unless-stopped
    environment:
      <<: *go-common-env
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-fsp}:${POSTGRES_PASSWORD:-fsp}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${EMPLOYER_DB:-employer_db}?sslmode=disable
    ports:
      - "${EMPLOYER_HOST_PORT:-8084}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      dict:
        condition: service_started
    networks: [fsp]

  # Testing
  testing:
    build:
      context: .
      dockerfile: Dockerfile.testing
    restart: unless-stopped
    environment:
      <<: *go-common-env
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-fsp}:${POSTGRES_PASSWORD:-fsp}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${TESTING_DB:-testing_db}?sslmode=disable
    ports:
      - "${TESTING_HOST_PORT:-8085}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      dict:
        condition: service_started
    networks: [fsp]

  # Interaction
  interaction:
    build:
      context: .
      dockerfile: Dockerfile.interaction
    restart: unless-stopped
    environment:
      <<: *go-common-env
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-fsp}:${POSTGRES_PASSWORD:-fsp}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${INTERACTION_DB:-interaction_db}?sslmode=disable
    ports:
      - "${INTERACTION_HOST_PORT:-8086}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      candidate:
        condition: service_started
      employer:
        condition: service_started
    networks: [fsp]

  # Search (read-model)
  search:
    build:
      context: .
      dockerfile: Dockerfile.search
    restart: unless-stopped
    environment:
      <<: *go-common-env
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-fsp}:${POSTGRES_PASSWORD:-fsp}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${SEARCH_DB:-search_db}?sslmode=disable
    ports:
      - "${SEARCH_HOST_PORT:-8087}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      candidate:
        condition: service_started
      testing:
        condition: service_started
    networks: [fsp]

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      auth:
        condition: service_started
    networks: [fsp]

volumes:
  pgdata:
    name: fsp_pgdata

networks:
  fsp:
    name: fsp_net
    driver: bridge