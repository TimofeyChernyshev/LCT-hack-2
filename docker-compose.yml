name: fsp-platform

x-pg-env: &pg-env
  POSTGRES_USER: ${POSTGRES_USER:-fsp}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsp}
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}

x-common-env: &common-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-32-chars-min}
  JWT_ISSUER: ${JWT_ISSUER:-fsp-platform}

x-service-base: &service-base
  restart: unless-stopped
  networks: [fsp]
  depends_on:
    postgres:
      condition: service_healthy

services:

  # Postgres
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fsp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsp}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-auth_db,dict_db,candidate_db,employer_db,testing_db,interaction_db,search_db}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/00-init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fsp} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [fsp]

  # MailHog
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "${MAILHOG_UI_PORT:-8025}:8025"
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
    networks: [fsp]

  # Swagger  
  swagger:
    image: swaggerapi/swagger-ui
    environment:
      URLS: |
        [
          {"url":"${SWAGGER_SPEC_AUTH:-/specs/auth.yaml}","name":"auth"},
          {"url":"${SWAGGER_SPEC_DICT:-/specs/dict.yaml}","name":"dict"},
          {"url":"${SWAGGER_SPEC_CANDIDATE:-/specs/candidate.yaml}","name":"candidate"},
          {"url":"${SWAGGER_SPEC_EMPLOYER:-/specs/employer.yaml}","name":"employer"},
          {"url":"${SWAGGER_SPEC_TESTING:-/specs/testing.yaml}","name":"testing"},
          {"url":"${SWAGGER_SPEC_INTERACTION:-/specs/interaction.yaml}","name":"interaction"},
          {"url":"${SWAGGER_SPEC_SEARCH:-/specs/search.yaml}","name":"search"}
        ]  
    volumes:
      - ./api:/usr/share/nginx/html/specs:ro
    ports:
      - "${SWAGGER_HOST_PORT:-8090}:8080"
    networks: [fsp]

  # nginx
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./api:/usr/share/nginx/html/specs:ro
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:80"
    depends_on:
      - auth
      - dict
      - candidate
      - employer
      - testing
      - interaction
      - search
      - frontend
    networks: [fsp]

  # Auth
  auth:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile.auth
    environment:
      <<: [*common-env, *pg-env]
      HTTP_PORT: "8080"
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth_db}
      AUTH_SHUTDOWN_TIMEOUT: ${AUTH_SHUTDOWN_TIMEOUT:-30s}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      EMAIL_VERIFICATION_TTL: ${EMAIL_VERIFICATION_TTL:-24h}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-1h}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@fsp.local}
      SMTP_TLS: ${SMTP_TLS:-false}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      AUTH_RATE_LIMITER_RPS: ${AUTH_RATE_LIMITER_RPS:-20}
      AUTH_RATE_LIMITER_BURST: ${AUTH_RATE_LIMITER_BURST:-40}
    ports:
      - "${AUTH_HOST_PORT:-8081}:8080"

  # Dict
  dict:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile.dict
    environment:
      <<: [*common-env, *pg-env]
      HTTP_PORT: "8080"
      DICT_DB_NAME: ${DICT_DB_NAME:-dict_db}
      DICT_SHUTDOWN_TIMEOUT: ${DICT_SHUTDOWN_TIMEOUT:-30s}
      DICT_CACHE_TTL: ${DICT_CACHE_TTL:-10m}
    ports:
      - "${DICT_HOST_PORT:-8082}:8080"

  # Candidate
  candidate:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile.candidate
    environment:
      <<: [*common-env, *pg-env]
      HTTP_PORT: "8080"
      CANDIDATE_DB_NAME: ${CANDIDATE_DB_NAME:-candidate_db}
      CANDIDATE_SHUTDOWN_TIMEOUT: ${CANDIDATE_SHUTDOWN_TIMEOUT:-30s}
      CANDIDATE_UPLOAD_DIR: ${CANDIDATE_UPLOAD_DIR:-/var/lib/fsp/uploads}
      CANDIDATE_MAX_UPLOAD_BYTES: ${CANDIDATE_MAX_UPLOAD_BYTES:-10485760}
      CANDIDATE_HTTP_TIMEOUT: ${CANDIDATE_HTTP_TIMEOUT:-5s}
      CANDIDATE_HTTP_RETRIES: ${CANDIDATE_HTTP_RETRIES:-3}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth:8080}
      DICT_SERVICE_URL: ${DICT_SERVICE_URL:-http://dict:8080}
      TESTING_SERVICE_URL: ${TESTING_SERVICE_URL:-http://testing:8080}
    volumes:
      - candidate_uploads:/var/lib/fsp/uploads
    ports:
      - "${CANDIDATE_HOST_PORT:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      dict:
        condition: service_started

  # Employer
  employer:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile.employer
    environment:
      <<: [*common-env, *pg-env]
      HTTP_PORT: "8080"
      EMPLOYER_DB_NAME: ${EMPLOYER_DB_NAME:-employer_db}
      EMPLOYER_SHUTDOWN_TIMEOUT: ${EMPLOYER_SHUTDOWN_TIMEOUT:-30s}
      EMPLOYER_HTTP_TIMEOUT: ${EMPLOYER_HTTP_TIMEOUT:-5s}
      EMPLOYER_HTTP_RETRIES: ${EMPLOYER_HTTP_RETRIES:-3}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth:8080}
      DICT_SERVICE_URL: ${DICT_SERVICE_URL:-http://dict:8080}
      INTERACTION_SERVICE_URL: ${INTERACTION_SERVICE_URL:-http://interaction:8080}
    ports:
      - "${EMPLOYER_HOST_PORT:-8084}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      dict:
        condition: service_started

  # Testing
  testing:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile.testing
    environment:
      <<: [*common-env, *pg-env]
      HTTP_PORT: "8080"
      TESTING_DB_NAME: ${TESTING_DB_NAME:-testing_db}
      TESTING_SHUTDOWN_TIMEOUT: ${TESTING_SHUTDOWN_TIMEOUT:-30s}
      GRADE_CHANGE_COOLDOWN_DAYS: ${GRADE_CHANGE_COOLDOWN_DAYS:-90}
      TESTING_ITEMS_PER_SESSION: ${TESTING_ITEMS_PER_SESSION:-20}
      TESTING_PASS_THRESHOLD_RATIO: ${TESTING_PASS_THRESHOLD_RATIO:-0.7}
      TESTING_UPGRADE_THRESHOLD_RATIO: ${TESTING_UPGRADE_THRESHOLD_RATIO:-0.9}
      TESTING_HTTP_TIMEOUT: ${TESTING_HTTP_TIMEOUT:-5s}
      TESTING_HTTP_RETRIES: ${TESTING_HTTP_RETRIES:-3}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth:8080}
      DICT_SERVICE_URL: ${DICT_SERVICE_URL:-http://dict:8080}
      CANDIDATE_SERVICE_URL: ${CANDIDATE_SERVICE_URL:-http://candidate:8080}
      FSP_REGISTRY_URL: ${FSP_REGISTRY_URL:-http://fspmock:8080}
    ports:
      - "${TESTING_HOST_PORT:-8085}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      dict:
        condition: service_started

  # FSP Registry Mock
  fspmock:
    build:
      context: .
      dockerfile: Dockerfile.fspmock
    restart: unless-stopped
    environment:
      <<: *common-env
      HTTP_PORT: "8080"
    ports:
      - "${FSPMOCK_HOST_PORT:-8088}:8080"
    networks: [fsp]

  # Interaction
  interaction:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile.interaction
    environment:
      <<: [*common-env, *pg-env]
      HTTP_PORT: "8080"
      INTERACTION_DB_NAME: ${INTERACTION_DB_NAME:-interaction_db}
      INTERACTION_SHUTDOWN_TIMEOUT: ${INTERACTION_SHUTDOWN_TIMEOUT:-30s}
      INTERACTION_HTTP_TIMEOUT: ${INTERACTION_HTTP_TIMEOUT:-5s}
      INTERACTION_HTTP_RETRIES: ${INTERACTION_HTTP_RETRIES:-3}
      REVEAL_CONTACTS_ON_APPLICATION: ${REVEAL_CONTACTS_ON_APPLICATION:-true}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth:8080}
      CANDIDATE_SERVICE_URL: ${CANDIDATE_SERVICE_URL:-http://candidate:8080}
      EMPLOYER_SERVICE_URL: ${EMPLOYER_SERVICE_URL:-http://employer:8080}
    ports:
      - "${INTERACTION_HOST_PORT:-8086}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      candidate:
        condition: service_started
      employer:
        condition: service_started

  # Search
  search:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile.search
    environment:
      <<: [*common-env, *pg-env]
      HTTP_PORT: "8080"
      SEARCH_DB_NAME: ${SEARCH_DB_NAME:-search_db}
      SEARCH_SHUTDOWN_TIMEOUT: ${SEARCH_SHUTDOWN_TIMEOUT:-30s}
      SEARCH_SYNC_BATCH_SIZE: ${SEARCH_SYNC_BATCH_SIZE:-100}
      SEARCH_SYNC_INTERVAL: ${SEARCH_SYNC_INTERVAL:-30s}
      SEARCH_DEFAULT_LIMIT: ${SEARCH_DEFAULT_LIMIT:-20}
      SEARCH_MAX_LIMIT: ${SEARCH_MAX_LIMIT:-100}
      SEARCH_HTTP_TIMEOUT: ${SEARCH_HTTP_TIMEOUT:-5s}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth:8080}
      DICT_SERVICE_URL: ${DICT_SERVICE_URL:-http://dict:8080}
      CANDIDATE_SERVICE_URL: ${CANDIDATE_SERVICE_URL:-http://candidate:8080}
      TESTING_SERVICE_URL: ${TESTING_SERVICE_URL:-http://testing:8080}
    ports:
      - "${SEARCH_HOST_PORT:-8087}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      candidate:
        condition: service_started
      testing:
        condition: service_started

  # Frontend
  frontend:
    build:
      context: ./deploy/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      auth:
        condition: service_started
    networks: [fsp]

volumes:
  pgdata:
    name: fsp_pgdata
  candidate_uploads:
    name: fsp_candidate_uploads

networks:
  fsp:
    name: fsp_net
    driver: bridge